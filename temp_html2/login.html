<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - AutoCare</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#002d43",
                        "secondary-container": "#3a4a5f",
                        "surface-container-highest": "#283647",
                        "on-background": "#d5e4fa",
                        "outline-variant": "#424654",
                        "surface-container-low": "#0e1c2d",
                        "on-primary": "#002d6e",
                        "on-primary-container": "#002761",
                        "on-primary-fixed": "#001944",
                        "on-error": "#690005",
                        "inverse-primary": "#0058ca",
                        "on-tertiary": "#00344d",
                        "background": "#051424",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "surface-variant": "#283647",
                        "secondary-fixed": "#d3e4fe",
                        "tertiary": "#89ceff",
                        "secondary": "#b7c8e1",
                        "surface-dim": "#051424",
                        "tertiary-fixed-dim": "#89ceff",
                        "error": "#ffb4ab",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "outline": "#8c90a0",
                        "on-secondary": "#213145",
                        "surface-container": "#122031",
                        "on-secondary-fixed": "#0b1c30",
                        "on-secondary-fixed-variant": "#38485d",
                        "primary-fixed": "#d9e2ff",
                        "surface": "#051424",
                        "surface-container-lowest": "#010f1f",
                        "on-surface-variant": "#c2c6d7",
                        "primary-fixed-dim": "#b0c6ff",
                        "tertiary-fixed": "#c9e6ff",
                        "surface-bright": "#2c3a4c",
                        "on-secondary-container": "#a9bad3",
                        "primary-container": "#558dff",
                        "tertiary-container": "#009ada",
                        "surface-tint": "#b0c6ff",
                        "on-primary-fixed-variant": "#00429b",
                        "primary": "#b0c6ff",
                        "on-surface": "#d5e4fa",
                        "inverse-on-surface": "#233143",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container-high": "#1d2b3c",
                        "inverse-surface": "#d5e4fa",
                        "on-tertiary-fixed": "#001e2f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "md": "16px",
                        "lg": "24px",
                        "grid-margin": "24px",
                        "grid-gutter": "16px",
                        "base": "8px",
                        "sm": "8px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "display-lg": ["Montserrat"],
                        "body-md": ["Montserrat"],
                        "headline-lg-mobile": ["Montserrat"],
                        "headline-lg": ["Montserrat"],
                        "label-sm": ["Montserrat"],
                        "body-lg": ["Montserrat"],
                        "headline-md": ["Montserrat"],
                        "label-md": ["Montserrat"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],

                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom input autofill override to maintain dark theme */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #051424 inset !important;
            -webkit-text-fill-color: #d5e4fa !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-grid-margin antialiased">
<!-- Main Content Canvas (Transaction Page -> Nav Suppressed) -->
<main class="w-full max-w-sm flex flex-col gap-lg">
<!-- Header / Brand -->
<div class="text-center flex flex-col items-center gap-sm mb-md">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-on-primary" style="font-size: 28px;">directions_car</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary">AutoCare</h1>
<p class="font-body-md text-body-md text-on-surface-variant">System Access</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-low border border-surface-container-high rounded-lg p-lg w-full flex flex-col gap-md">
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-base top-1/2 -translate-y-1/2 text-outline-variant" style="font-size: 20px;">mail</span>
<input class="w-full bg-surface border border-surface-container-high rounded p-base pl-xl font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 focus:outline-none transition-colors" id="email" name="email" placeholder="admin@autocare.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-base top-1/2 -translate-y-1/2 text-outline-variant" style="font-size: 20px;">lock</span>
<input class="w-full bg-surface border border-surface-container-high rounded p-base pl-xl font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 focus:outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Links -->
<div class="flex justify-between items-center mt-xs">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-fixed transition-colors" href="#">Lupa Password</a>
</div>
<!-- Submit Button -->
<button class="w-full mt-sm bg-primary hover:bg-primary-fixed text-on-primary font-label-md text-label-md py-base px-md rounded transition-colors flex items-center justify-center gap-xs" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined" style="font-size: 18px;">login</span>
</button>
</form>
</div>
<!-- Registration Link -->
<div class="text-center mt-base">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                Belum memiliki akun? 
                <a class="text-primary hover:text-primary-fixed transition-colors font-label-md text-label-md ml-xs" href="#">Daftar</a>
</p>
</div>
</main>
</body></html>
