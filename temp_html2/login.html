        }

        .btn-primary-gradient:hover {
            box-shadow: 0 0 20px rgba(76, 215, 246, 0.4);

<span class="material-symbols-outlined text-primary group-hover:text-primary-fixed transition-colors" data-icon="dark_mode">dark_mode</span>
</button>
<!-- Main Login Container -->
<main class="relative z-10 w-full max-w-[480px] px-container-padding">
<!-- Glass Card -->
<div class="glass-panel rounded-xl p-8 md:p-12 ambient-glow relative overflow-hidden flex flex-col items-center">
<!-- Diagonal Light Sweep Effect inside card -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary/50 to-transparent"></div>
<!-- Header Section -->
<div class="w-full text-center mb-10 flex flex-col items-center">
<div class="w-24 h-24 mb-6 rounded-full glass-panel p-2 shadow-[0_0_30px_rgba(76,215,246,0.2)]">
<img alt="AutoCare Logo" class="w-full h-full object-contain rounded-full" src="https://lh3.googleusercontent.com/aida/AP1WRLuOi-fKT5G3ETKsEt4RFHebcQw6PqvDMD5QMTawKTH1A2XM9z1a3YaVXpfYo5zIBPjkpEaqdyIJ2Ykn2yqD1SaGpHiMsY4Il4O14JqY61Bjc5GljCSb8h3kMJh5XNeLsQqkO81DgbJc-BZxgXLcfLn0WynuFuMKeoog2EELfVd55N0EeCEuYHXM8aJ7kbmZxnbwL5oornidPs7FA7uPdC7Xu71O48Q1i0DU8rtvZzVOh85ef-pLeQEpXJA"/>
</div>
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface mb-2 tracking-tight">
                    Selamat Datang
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                    Akses dashboard AutoCare Anda untuk pemantauan sistem.
                </p>
</div>
<!-- Login Form -->
<form action="#" class="w-full space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label-caps text-label-caps text-primary uppercase tracking-widest pl-1" for="email">
                        Email Address
                    </label>
<div class="relative input-glass rounded-DEFAULT flex items-center px-4 py-3 group">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary mr-3 transition-colors text-lg" data-icon="mail">mail</span>
<input class="bg-transparent border-none w-full text-on-surface font-body-md focus:ring-0 placeholder:text-outline/50 p-0" id="email" name="email" placeholder="admin@autocare.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center pl-1">
<label class="block font-label-caps text-label-caps text-primary uppercase tracking-widest" for="password">
                            Password
                        </label>
<a class="font-label-caps text-[10px] text-primary/70 hover:text-primary transition-colors tracking-wider" href="#">
                            Lupa Password?
                        </a>
</div>
<div class="relative input-glass rounded-DEFAULT flex items-center px-4 py-3 group">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary mr-3 transition-colors text-lg" data-icon="lock">lock</span>
<input class="bg-transparent border-none w-full text-on-surface font-body-md focus:ring-0 placeholder:text-outline/50 p-0 tracking-widest" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="ml-3 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-lg" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Action Area -->
<div class="pt-4">
<button class="w-full btn-primary-gradient rounded-full py-4 px-6 font-body-lg text-body-lg font-semibold text-on-primary flex items-center justify-center gap-2 group shadow-[0_4px_14px_0_rgba(76,215,246,0.39)]" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center">
<p class="font-label-caps text-label-caps text-on-surface-variant">
                    Sistem Operasi Phantom <span class="text-primary/50 mx-2">|</span> v2.4.1
                </p>
</div>
